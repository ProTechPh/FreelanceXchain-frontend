<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- FreelanceXchain mark: two capsule chain links crossed at 45 degrees into
       an X, interlocked with a single over/under weave. Standalone copy. It
       cannot read the app's brand ramp custom properties, so it carries its own
       ramp below, with a dark-scheme lift matching the .dark tokens in
       globals.css. Note: no double hyphens in this comment. Served as
       image/svg+xml, the file is parsed as strict XML, where "- -" (joined) is
       an illegal token inside a comment and kills the whole document. -->
  <style>
    svg { --b1: #2f9c7c; --b2: #166e58; --b3: #0f4c3d; }
    @media (prefers-color-scheme: dark) {
      svg { --b1: #8fe7cd; --b2: #3ec9a7; --b3: #2d7a5f; }
    }
  </style>
  <defs>
    <linearGradient id="fxcLinkFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--b1, #2f9c7c)" />
      <stop offset="100%" stop-color="var(--b2, #166e58)" />
    </linearGradient>
    <linearGradient id="fxcLinkBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--b2, #166e58)" />
      <stop offset="100%" stop-color="var(--b3, #0f4c3d)" />
    </linearGradient>
    <clipPath id="fxcOverSide">
      <polygon points="0,0 100,0 100,100" />
    </clipPath>
    <mask id="fxcWeave" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff" />
      <g clip-path="url(#fxcOverSide)">
        <rect x="0" y="37" width="100" height="26" rx="13" transform="rotate(45 50 50)"
              fill="none" stroke="#000" stroke-width="14" />
      </g>
    </mask>
  </defs>

  <rect x="0" y="37" width="100" height="26" rx="13" transform="rotate(45 50 50)"
        fill="none" stroke="url(#fxcLinkBack)" stroke-width="10.5" />
  <g mask="url(#fxcWeave)">
    <rect x="0" y="37" width="100" height="26" rx="13" transform="rotate(-45 50 50)"
          fill="none" stroke="url(#fxcLinkFront)" stroke-width="10.5" />
  </g>
</svg>
