allowBuilds:
  sharp: true
  unrs-resolver: true

# Transitive security patches. Each stays inside the parent's major line.
# postcss needs an override rather than a lockfile refresh because next pins it
# to an exact 8.4.31. Drop entries here once upstream ships the bumps.
overrides:
  # libvips CVE-2026-33327/33328/35590/35591. next declares sharp ^0.34.5, but
  # the fix only exists in 0.35.x, so this override is intentionally outside
  # next's declared range. Remove once next widens its range.
  sharp@0: ^0.35.3
  postcss@8: ^8.5.23
  nanoid@3: ^3.3.18
  js-yaml@4: ^4.3.1
  brace-expansion@1: ^1.1.16
  brace-expansion@5: ^5.0.9
  browserslist@<=4.28.6: '>=4.28.7'

