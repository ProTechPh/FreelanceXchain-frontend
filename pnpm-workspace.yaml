allowBuilds:
  '@reown/appkit': true
  protobufjs: false
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - uuid@11.1.1
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8

# Transitive security patches. Each stays inside the parent's major line.
# postcss needs an override rather than a lockfile refresh because next pins it
# to an exact 8.4.31. Drop entries here once upstream ships the bumps.
overrides:
  # libvips CVE-2026-33327/33328/35590/35591. next declares sharp ^0.34.5, but
  # the fix only exists in 0.35.x, so this override is intentionally outside
  # next's declared range. Remove once next widens its range.
  sharp@0: ^0.35.4
  postcss@8: ^8.5.23
  nanoid@3: ^3.3.18
  js-yaml@4: ^4.3.1
  brace-expansion@1: ^1.1.20
  brace-expansion@5: ^5.0.12
  browserslist@<=4.28.6: '>=4.28.7'
  uuid@<11.1.1: ^11.1.1

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack-exhaustion DoS. Mitigated by patches/braces@3.0.3.patch
    # (the depth limits from upstream PR micromatch/braces#72), since no fixed
    # release exists on npm yet. pnpm audit matches on version only, so it still
    # flags the patched 3.0.3. Once 3.0.4 ships, delete this entry, the patch
    # and its patchedDependencies line, and add a `braces@3: ^3.0.4` override.
    - GHSA-vfj7-8cjw-p6xm

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
